<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock / Countdown Timer</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock"></div>
   
    <hr>
   
    <div class="timer-section">
        <h1>Countdown Timer</h1>
        <input type="number" id="hours" placeholder="Hours" min="0">
        <input type="number" id="minutes" placeholder="Minutes" min="0">
        <input type="number" id="seconds" placeholder="Seconds" min="0">
        <br>
        <button onclick="startTimer()">Start Timer</button>
        <button onclick="resetTimer()">Reset</button>
        <div id="timer">00:00:00</div>
    </div>
    <footer style="
    width: 100%;
    background: #0f1e46;
    color: white;
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
    position: fixed;
    bottom: 0;
    left: 0;
">
    © Member • Nipa • Hernandez • Estrimos — All rights reserved.
     </footer>
    
    <script src="index.js"></script>
</body>
</html>
